<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>메시지</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #D4537E;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  }
  #stage {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  #catimg {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 20px;
  }
  #msg {
    color: #ffffff;
    font-size: 18px;
    text-align: center;
    line-height: 1.6;
    margin: 0 0 28px;
    max-width: 320px;
    word-break: keep-all;
  }
  #btnrow {
    display: flex;
    gap: 16px;
    position: relative;
    width: 100%;
    max-width: 320px;
    min-height: 48px;
    justify-content: center;
  }
  button {
    flex: 1;
    max-width: 130px;
    background: #ffffff;
    color: #D4537E;
    border: none;
    border-radius: 10px;
    height: 48px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  #noBtn { position: relative; }
  #final {
    color: #ffffff;
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
</style>
</head>

<script>
  var params = new URLSearchParams(window.location.search);
  var revealText = params.get('msg');
  if (!revealText) { revealText = '뭘 봐?'; }
  document.getElementById('msg').textContent = '이 메시지 봐줘ㅎㅎ';

  var noBtn = document.getElementById('noBtn');
  var row = document.getElementById('btnrow');

  function dodge() {
    var rowRect = row.getBoundingClientRect();
    var btnRect = noBtn.getBoundingClientRect();
    var maxX = rowRect.width - btnRect.width;
    var maxY = 70;
    var nx = Math.random() * Math.max(maxX, 0);
    var ny = (Math.random() - 0.5) * maxY;
    noBtn.style.position = 'absolute';
    noBtn.style.left = nx + 'px';
    noBtn.style.top = ny + 'px';
    noBtn.style.transition = 'left 0.15s ease, top 0.15s ease';
  }

  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); dodge(); }, {passive:false});
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('click', function(e){ e.preventDefault(); dodge(); });

  document.getElementById('yesBtn').addEventListener('click', function() {
    var stage = document.getElementById('stage');
    stage.innerHTML = '';
    var final = document.createElement('div');
    final.id = 'final';
    final.textContent = revealText;
    stage.appendChild(final);
    requestAnimationFrame(function() {
      final.style.opacity = '1';
    });
  });
</script>

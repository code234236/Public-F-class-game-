<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메시지 만들기</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #FFD1E8;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    min-height: 100vh;
    box-sizing: border-box;
  }
  #wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 40px 24px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 20px;
    color: #72243E;
    margin: 0 0 20px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 14px;
    color: #993556;
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    border-radius: 10px;
    border: none;
    padding: 12px;
    font-size: 16px;
    box-sizing: border-box;
    resize: vertical;
    font-family: inherit;
    background: #ffffff;
    color: #4B1528;
  }
  button {
    display: block;
    width: 100%;
    margin-top: 20px;
    background: #D4537E;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    height: 48px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  #result {
    margin-top: 24px;
    display: none;
  }
  #urlBox {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #urlText {
    flex: 1;
    background: #ffffff;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    color: #4B1528;
    word-break: break-all;
    box-sizing: border-box;
  }
  #copyBtn {
    width: auto;
    padding: 0 16px;
    height: 44px;
    margin-top: 0;
    font-size: 14px;
  }
  #hint {
    font-size: 12px;
    color: #993556;
    margin-top: 10px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>예를 눌렀을 때 나올 문구를 정하세요</h1>
  <label for="siteInput">사이트 주소 (https, GitHub Pages 등)</label>
  <textarea id="siteInput" style="min-height:auto; height:44px;" placeholder="https://아이디.github.io/저장소/">https://아이디.github.io/저장소/</textarea>
  <label for="msgInput" style="margin-top:16px;">뭘 봐? 자리에 들어갈 텍스트</label>
  <textarea id="msgInput" placeholder="뭘 봐?">뭘 봐?</textarea>
  <button id="doneBtn">완성</button>

  <div id="result">
    <label>생성된 링크</label>
    <div id="urlBox">
      <div id="urlText"></div>
      <button id="copyBtn">복사</button>
    </div>
    <div id="hint">editor.html과 viewer.html을 같은 GitHub 저장소에 올리고 GitHub Pages를 켜면 실제 https 링크로 작동해요.</div>
  </div>
</div>
<script>
  document.getElementById('doneBtn').addEventListener('click', function() {
    var text = document.getElementById('msgInput').value.trim();
    if (!text) { text = '뭘 봐?'; }
    var site = document.getElementById('siteInput').value.trim();
    if (!site) { site = window.location.href.replace(/editor\.html.*$/, ''); }
    if (site.indexOf('https://') !== 0) {
      document.getElementById('urlText').textContent = '사이트 주소는 https:// 로 시작해야 해요.';
      document.getElementById('result').style.display = 'block';
      return;
    }
    if (site.charAt(site.length - 1) !== '/') { site += '/'; }
    var url = site + 'viewer.html?msg=' + encodeURIComponent(text);
    document.getElementById('urlText').textContent = url;
    document.getElementById('result').style.display = 'block';
  });

  document.getElementById('copyBtn').addEventListener('click', function() {
    var url = document.getElementById('urlText').textContent;
    navigator.clipboard.writeText(url).then(function() {
      var btn = document.getElementById('copyBtn');
      var original = btn.textContent;
      btn.textContent = '복사됨';
      setTimeout(function() { btn.textContent = original; }, 1200);
    });
  });
</script>
</body>
</html>
